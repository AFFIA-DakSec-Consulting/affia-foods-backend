# Tableau de bord Affia Foods. Sur Netlify : "Base directory" = web/super_admin (le reste est lu ici).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Adresse de l'API : à changer ici (et dans la règle connect-src plus bas) quand le domaine de l'API change.
  VITE_API_BASE_URL = "https://api.kraveo.site"
  VITE_SOCKET_URL = "https://api.kraveo.site"

# Les appels /api passent par le même domaine que le tableau de bord.
[[redirects]]
  from = "/api/*"
  to = "https://api.kraveo.site/api/:splat"
  status = 200
  force = true

# Application d'une seule page : toute adresse inconnue ouvre l'application.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.kraveo.site wss://api.kraveo.site; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
