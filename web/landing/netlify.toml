# Site vitrine Affia Foods. Sur Netlify : "Base directory" = web/landing (le reste est lu ici).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Adresses propres : /contact ouvre contact/index.html sans redirection.
[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200
[[redirects]]
  from = "/partenaire"
  to = "/partenaire/index.html"
  status = 200
[[redirects]]
  from = "/livreur"
  to = "/livreur/index.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200
[[redirects]]
  from = "/refunds"
  to = "/refunds/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
